name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the package without publishing it
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: clawhub-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ClawHub Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Check out the exact TweetClaw source revision.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build package artifact
        run: npm pack
      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clawhub-package
          path: xquik-tweetclaw-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ClawHub Package
    needs: build
    permissions:
      actions: read # Read package artifacts in the reusable publisher.
      contents: read # Check out the exact TweetClaw source revision.
      id-token: write # Exchange GitHub OIDC for a scoped ClawHub token.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908
    with:
      source: Xquik-dev/tweetclaw
      ref: ${{ github.sha }}
      dry_run: ${{ inputs.dry_run }}
      json: true
      package_artifact_name: clawhub-package
      source_repo: Xquik-dev/tweetclaw
      source_commit: ${{ github.sha }}
      source_ref: ${{ github.ref }}
