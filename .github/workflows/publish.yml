name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  cancel-in-progress: false
  group: tweetclaw-npm-release

jobs:
  publish:
    name: Publish Verified Package
    if: github.repository == 'Xquik-dev/tweetclaw'
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: read
      id-token: write # Request npm's short-lived OIDC credential.
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail

          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error ::Releases must run from a tag."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error ::Release tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

          git fetch --no-tags origin master
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          master_commit="$(git rev-parse 'origin/master^{commit}')"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error ::Tag commit does not match the workflow commit."
            exit 1
          fi
          if [ "$tag_commit" != "$master_commit" ]; then
            echo "::error ::Release tag must point to the current master commit."
            exit 1
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Run release checks
        run: npm run check:all
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Check npm registry
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          if npm view "$package" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package is already published. Skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package
        if: steps.registry.outputs.published != 'true'
        run: npm run publish-clean
      - name: Verify npm publication
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          published_version="$(npm view "$package" version)"
          if [ "$published_version" != "$PACKAGE_VERSION" ]; then
            echo "::error ::npm returned version $published_version after publication."
            exit 1
          fi

  release:
    name: Create GitHub Release
    if: github.repository == 'Xquik-dev/tweetclaw'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Create the verified tag's GitHub release.
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/tweetclaw-release-notes.md"
          printf '%s\n' \
            'Xquik is an independent third-party service. Not affiliated with X Corp. "Twitter" and "X" are trademarks of X Corp.' \
            > "$notes_file"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes_file"
