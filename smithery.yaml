startCommand:
  type: http
  configSchema:
    type: object
    anyOf:
      - required:
          - apiKey
      - required:
          - tempoSigningKey
    properties:
      apiKey:
        type: string
        description: "Xquik API key (prefix xq_) from dashboard.xquik.com. Includes 33 prepaid public paid-read routes. Not affiliated with X Corp."
      tempoSigningKey:
        type: string
        description: "MPP signing key for 7 direct read routes. No account needed. Not affiliated with X Corp."
  url: "https://xquik.com/mcp"
